<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library project</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 class="main-head">My Library</h1>
    <form action="" class="form">
        <div class="form-field">
            <label for="_bookname">Book Name</label>
            <input type="text" id="_bookname">
        </div>
        <div class="form-field">
            <label for="_author">Author</label>
            <input type="text" id="_author">
        </div>
        <div class="form-field">
            <label for="_page-count">Pages</label>
            <input type="number" name="_page-count" id="_page-count">
        </div>
        <button type="button" id="_addBookToLibrary">Add Book to library</button>
    </form>
    <main class="card-container">

    </main>
</body>

</html>
