<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form action="" method="get">
        <label for="location">Location:</label>
        <input type="text" name="location" id="location">
        <button type="submit" id="submit-btn">Fetch weather</button>
    </form>
    <div class="weather">
        <button type="button" id="unit-btn">Fahrenheit</button>
        <table>
            <tr>
                <th>
                    Location
                </th>
                <td id="location-name">

                </td>
            </tr>
            <tr>
                <th>Current weather</th>
                <td id="current-weather">

                </td>
            </tr>
            <tr>
                <th>Temperature</th>
                <td id="current-temperature">

                </td>
            </tr>

        </table>
    </div>
</body>

</html>
