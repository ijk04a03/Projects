<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">
        <div class="calculator">
            <input id="calc-input" type="text" disabled>
            <div class="row">
                <button id="backspace">&#9003;</button>
                <button id="reset">AC</button>
                <button id="percentage">%</button>
                <button class="orange" id="division">&#247;</button>
            </div>
            <div class="row">
                <button id="seven">7</button>
                <button id="eight">8</button>
                <button id="nine">9</button>
                <button class="orange" id="multiplication">&#215;</button>
            </div>
            <div class="row">
                <button id="four">4</button>
                <button id="five">5</button>
                <button id="six">6</button>
                <button class="orange" id="subtraction">-</button>
            </div>
            <div class="row">
                <button id="one">1</button>
                <button id="two">2</button>
                <button id="three">3</button>
                <button class="orange" id="addition">+</button>
            </div>
            <div class="row">
                <button id="plusminus">&plusmn;</button>
                <button id="zero">0</button>
                <button id="period">.</button>
                <button class="orange" id="equals">=</button>
            </div>
        </div>
    </div>
</body>

</html>
