<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shopping list</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <h1 class="header">My Shopping list</h1>
        <label for="newitem">Enter a new item: </label>
        <input type="text" id="newitem" placeholder="Add new item to the shopping list...">
        <button id="addBtn">Add Item</button>
        <div class="shopping-list">
            <ul class="mylist">

            </ul>
        </div>
    </div>

</body>

</html>
