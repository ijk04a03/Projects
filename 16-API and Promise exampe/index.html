<body>
    <div class="container">
        <img src="" alt="giffy-gif" id="giffy-gif">
    </div>
    <button type="button" id="change-gif">New GIF</button>

<script>
    const img = document.querySelector("#giffy-gif");
    const btn = document.querySelector("#change-gif");
    let i = 0;

    async function getRandomCatGif() {
        try {
            let response = await fetch('https://api.giphy.com/v1/gifs/random?api_key=tlr85DMT12a01LY4OWGILikWwjARCwys&q=cat');
            const data = await response.json();
            img.src = data.data.images.original.url;
        } catch (error) {
            console.error("Image fetch failed", error);
        }
    }
