<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gif fetcher</title>
</head>

<body>
    <div class="container">
        <img src="" alt="giffy-gif" id="giffy-gif">
    </div>
    <button type="button" id="change-gif">New GIF</button>
</body>
<script>
    const img = document.querySelector("#giffy-gif");
    const btn = document.querySelector("#change-gif");
    let i = 0;
    function getRandomCatGif() {
        fetch(`https://api.giphy.com/v1/gifs/random?api_key=tlr85DMT12a01LY4OWGILikWwjARCwys&q=cat`)
            .then(function (response) {
                return response.json()
            })
            .then(function (aboveThensReturn) {
                const gifs = aboveThensReturn.data;
                // const randomIndex = Math.floor(Math.random() * gifs.length);
                // console.log(gifs);
                // console.log(gifs[randomIndex]);
                img.src = gifs.images.original.url;
            })
            .catch(error => console.error("Image fetch failed", error))
    }
    getRandomCatGif();
    btn.addEventListener('click', () => getRandomCatGif());

</script>

</html>
