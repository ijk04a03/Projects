<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="game">
        <header class="game-header">
            <h1>Rock Paper Scissors</h1>
        </header>

        <section class="scoreboard">
            <div class="score">Player: <span class="player-score">0</span></div>
            <div class="score">Computer: <span class="computer-score">0</span></div>
        </section>

        <section class="choices">
            <button class="choice" data-choice="rock">✊ Rock</button>
            <button class="choice" data-choice="paper">✋ Paper</button>
            <button class="choice" data-choice="scissors">✌️ Scissors</button>
        </section>

        <section class="result">
            <div class="round-result"></div>
            <div class="computer-response"></div>
        </section>

        <footer class="controls">
            <button class="reset-button">Reset</button>
        </footer>
    </main>
</body>

</html>
